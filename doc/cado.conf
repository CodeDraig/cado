# Capability Ambient DO configuration file
#
# Each entry is exactly:
#   capability-list : principal-list
# or:
#   capability-list : principal-list : condition-sequence
#
# Lists are comma separated. Capability items are libcap names (with or without
# cap_) or unsigned unprefixed hexadecimal masks. Principals are usernames or
# group names prefixed by @. A malformed entry invalidates the whole file.

# net_admin: @netadmin,renzo
# net_admin,net_bind_service,net_raw,net_broadcast: @vxvdex
# cap_kill: renzo
# setgid,setuid: giovanni: /usr/bin/logger cado identity caps for $USER
